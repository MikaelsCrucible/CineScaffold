[metadata]
name = cinescaffold
version = 0.1.16
description = Ground natural-language cinematic intent into a structured cinematic brief.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
python_requires = >=3.12,<3.13
package_dir =
    = src
packages = find:
include_package_data = True
install_requires =
    pydantic-ai-slim[openai,mcp]==2.36.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    cinescaffold = cinescaffold.cli:main
