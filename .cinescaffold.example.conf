# 复制本文件为 .cinescaffold.conf，然后填写下面三项。
provider = deepseek
model = 填写模型 ID
api_key = 填写 API KEY

# 以下均为可选项；不需要时保持注释即可。
# base_url = https://api.deepseek.com
# semantic_model = 单独指定自然语言转六维的模型
# planning_model = 单独指定六维转 Scene IR 的模型
# DeepSeek 思考开关只填 enabled/disabled；强度另填 low/high/max。
# OpenAI Responses 推理强度可填 none/low/medium/high/xhigh/max。
# Semantic Parser 缺省关闭思考，以保护 JSON 输出预算；需要实验时再显式开启。
# semantic_thinking_mode = disabled
# semantic_reasoning_effort = low
# semantic_max_tokens = 8192
# semantic_input_cost_per_million = 0.28
# semantic_output_cost_per_million = 0.42
# semantic_cache_read_cost_per_million = 0.028
# semantic_cost_currency = USD
# semantic_price_source = provider_pricing_YYYY-MM-DD
# planning_thinking_mode = enabled
# planning_reasoning_effort = low
# planning_model_max_tokens = 8192

# UI 的“高级设置”也会读写下面这些字段。
# semantic_timeout = 120
# planning_max_requests = 48
# planning_max_tool_calls = 80
# planning_max_context_tokens = 131072
# planning_max_output_tokens = 200000
# planning_max_seconds = 1200
# planning_max_commit_attempts = 5
# planning_trace_max_event_bytes = 32768
# planning_trace_max_string_chars = 4096

# 可选成本快照；四项单价均为每百万 token。
# planning_input_cost_per_million = 2
# planning_output_cost_per_million = 12
# planning_cache_read_cost_per_million = 0.2
# planning_cost_currency = USD
# planning_price_source = provider_pricing_snapshot

# Blender 执行设置。路径留空时按 macOS/Windows/Linux 自动寻找。
# execution_blender_path = /opt/homebrew/bin/blender
# execution_mcp_command = /Users/you/.local/bin/blender-mcp
# execution_build_backend = background
# execution_build_timeout_seconds = 180
# execution_render_backend = background
# execution_render_profile = preview
# execution_render_timeout_seconds = 600

# 若两个阶段使用不同供应商，可分别填写：
# semantic_provider = openai
# planning_provider = deepseek
# openai_api_key = 填写 OPENAI API KEY
# deepseek_api_key = 填写 DEEPSEEK API KEY
