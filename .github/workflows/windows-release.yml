name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned uv
        shell: pwsh
        run: |
          $env:UV_UNMANAGED_INSTALL = "$env:RUNNER_TEMP\uv"
          Invoke-RestMethod "https://astral.sh/uv/0.11.16/install.ps1" | Invoke-Expression
          "$env:RUNNER_TEMP\uv" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$env:RUNNER_TEMP\uv;$env:PATH"
          uv --version

      - name: Verify Windows dependency lock
        shell: pwsh
        run: |
          uv pip compile requirements-windows.in `
            --constraints requirements-ui.lock `
            --python-version 3.12 `
            --python-platform x86_64-pc-windows-msvc `
            --generate-hashes `
            --custom-compile-command "uv pip compile requirements-windows.in --constraints requirements-ui.lock --python-version 3.12 --python-platform x86_64-pc-windows-msvc --generate-hashes --output-file requirements-windows.lock" `
            --output-file requirements-windows.generated.lock
          if ((Get-FileHash requirements-windows.lock).Hash -ne (Get-FileHash requirements-windows.generated.lock).Hash) {
            git diff --no-index -- requirements-windows.lock requirements-windows.generated.lock
            throw "requirements-windows.lock is stale"
          }

      - name: Install and test on Windows
        shell: pwsh
        run: |
          uv venv --python 3.12 --clear .venv
          uv pip install --python .venv\Scripts\python.exe --require-hashes --requirements requirements-windows.lock
          uv pip install --python .venv\Scripts\python.exe --no-deps --editable .
          .venv\Scripts\python.exe -m unittest discover -s tests
          .venv\Scripts\python.exe -m cinescaffold --version

      - name: Build wheel and Windows bundle
        shell: pwsh
        run: |
          uv build --wheel --out-dir dist\wheel
          $version = .venv\Scripts\python.exe -c "import cinescaffold; print(cinescaffold.__version__)"
          $wheel = Get-ChildItem dist\wheel\cinescaffold-*.whl | Select-Object -Single
          $commit = git rev-parse HEAD
          .venv\Scripts\python.exe scripts\build_windows_release.py `
            --wheel $wheel.FullName `
            --uv-exe "$env:RUNNER_TEMP\uv\uv.exe" `
            --output-dir dist\windows `
            --version $version `
            --commit $commit

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: CineScaffold-Windows-x64
          path: |
            dist/windows/*.zip
            dist/windows/*.sha256
          if-no-files-found: error
          retention-days: 30
